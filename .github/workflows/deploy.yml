name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musichub
          POSTGRES_PASSWORD: musichub
          POSTGRES_DB: musichub
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://musichub:musichub@localhost:5432/musichub
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run check
      - run: bun run test
      - run: bun --bun run build

  build-and-push:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          push: true
          platforms: linux/arm64
          provenance: false
          # /health reports the commit as revision, the deploy job waits for it
          build-args: APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/robinchoice/musichub-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/robinchoice/musichub-${{ matrix.service }}:latest
      # The worker stage reuses the layers just built for the API
      - if: matrix.service == 'api'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          target: worker
          push: true
          platforms: linux/arm64
          provenance: false
          build-args: APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/robinchoice/musichub-worker:${{ github.sha }}
            ghcr.io/robinchoice/musichub-worker:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
      COOLIFY_WEB_UUID: ${{ secrets.COOLIFY_WEB_UUID }}
      COOLIFY_WORKER_UUID: ${{ secrets.COOLIFY_WORKER_UUID }}
      COOLIFY_API: https://coolify.pleasance.org/api/v1
      APP_URL: https://hub.pleasance.org
    steps:
      - name: Deploy images to Coolify
        run: |
          set -euo pipefail
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_API_UUID" ] || [ -z "$COOLIFY_WEB_UUID" ] || [ -z "$COOLIFY_WORKER_UUID" ]; then
            echo '::error::Required Coolify secrets are not set.'
            exit 1
          fi

          deploy() {
            curl --fail-with-body --silent --show-error -X PATCH \
              -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Content-Type: application/json' \
              -d "{\"docker_registry_image_tag\": \"$GITHUB_SHA\"}" \
              "$COOLIFY_API/applications/$1"
            echo

            deployment=$(curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_API/deploy?uuid=$1" |
              jq -er '.deployments[0].deployment_uuid')

            for _ in {1..60}; do
              status=$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $COOLIFY_TOKEN" \
                "$COOLIFY_API/deployments/$deployment" | jq -er '.status')
              echo "Deployment $deployment: $status"
              case "$status" in
                finished) return 0 ;;
                failed|cancelled-by-user) return 1 ;;
              esac
              sleep 10
            done
            echo "Deployment $deployment timed out." >&2
            return 1
          }

          # The API migrates first, the worker then takes the jobs queued meanwhile
          deploy "$COOLIFY_API_UUID"
          deploy "$COOLIFY_WORKER_UUID"
          deploy "$COOLIFY_WEB_UUID"

          # Coolify says finished once the containers run. Done means the public URL
          # serves this commit, which also catches a proxy route lost on recreate.
          for _ in {1..30}; do
            revision=$(curl --silent --max-time 10 "$APP_URL/api/v1/health" | jq -r '.revision // empty' 2>/dev/null || true)
            echo "Public revision: ${revision:-none}"
            [ "$revision" = "$GITHUB_SHA" ] && exit 0
            sleep 10
          done
          echo "$APP_URL/api/v1/health does not serve $GITHUB_SHA" >&2
          exit 1

  # Photographs the live site (apps/web/screenshots.ts) and commits docs/screenshots
  # to main when the pictures changed. [skip ci] keeps that commit from deploying again.
  screenshots:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://hub.pleasance.org
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - id: playwright
        run: |
          echo "version=$(grep -oP '"playwright": \["playwright@\K[^"]+' bun.lock)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
        working-directory: apps/web
      - run: bun run screenshots "$APP_URL"
        working-directory: apps/web
      - name: Commit the screenshots to main
        run: |
          set -euo pipefail
          mv docs/screenshots "$RUNNER_TEMP/screenshots"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # main may have moved on since this commit, a rejected push starts over from the new main
          for _ in 1 2 3; do
            git fetch --depth 1 origin main
            git checkout -f -B main FETCH_HEAD
            rm -rf docs/screenshots
            cp -r "$RUNNER_TEMP/screenshots" docs/screenshots
            git add -- docs/screenshots
            git diff --cached --quiet && exit 0
            git commit -m "docs: retake the screenshots for ${GITHUB_SHA::7} [skip ci]"
            git push origin main && exit 0
          done
          exit 1
      # Tells pleasance.org that the prototype is live with fresh screenshots.
      # A step, not its own job: every job is billed in whole minutes.
      - name: Send prototype-deployed to robinchoice/pleasance
        env:
          GH_TOKEN: ${{ secrets.PLEASANCE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "No PLEASANCE_DISPATCH_TOKEN secret yet, skipping"
            exit 0
          fi
          gh api repos/robinchoice/pleasance/dispatches \
            -f event_type=prototype-deployed \
            -f "client_payload[slug]=${GITHUB_REPOSITORY#*/}" \
            -f "client_payload[sha]=$GITHUB_SHA"
